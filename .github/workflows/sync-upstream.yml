name: Sync with Upstream

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:       # Allows manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_PAT }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream repository
        run: git remote add upstream https://${{ secrets.UPSTREAM_SYNC_PAT }}@github.com/The-CineX/CineX.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream/main into origin/main
        run: |
          git checkout main
          git merge upstream/main --no-ff --no-edit || echo "No changes to merge"

      - name: Push changes to fork
        run: git push origin main
