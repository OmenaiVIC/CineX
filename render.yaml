# CineX Backend — Render Blueprint
# Connect this repo to Render (render.com) to auto-deploy the backend.
# Free tier: web service sleeps after 15min inactivity, wakes on request.
services:
  - type: web
    name: cinex-backend
    env: node
    region: ohio
    buildCommand: cd backend && npm install
    startCommand: cd backend && node --experimental-sqlite src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
