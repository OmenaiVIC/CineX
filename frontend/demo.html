<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineX Demo — Cohort 0 Pilot</title>
  <style>
    :root { --bg: #0a0a0f; --card: #14141f; --border: #2a2a3f; --accent: #6366f1; --accent-hover: #818cf8; --success: #22c55e; --pending: #eab308; --text: #e2e8f0; --muted: #94a3b8 }
    * { margin: 0; padding: 0; box-sizing: border-box }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem }
    header { text-align: center; margin-bottom: 3rem }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent }
    header p { color: var(--muted); margin-top: 0.5rem }
    header .badge { display: inline-block; background: #1e293b; color: var(--accent); padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; margin-top: 0.75rem; border: 1px solid var(--border) }
    header .badge span { color: var(--muted) }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: border-color 0.2s }
    .card:hover { border-color: var(--accent) }
    .card h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.25rem }
    .card .creator { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem }
    .card .desc { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.4 }
    .goal-bar { background: var(--border); border-radius: 999px; height: 8px; margin-bottom: 0.5rem; overflow: hidden }
    .goal-bar .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), #a78bfa); transition: width 0.3s }
    .goal-text { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem }
    .goal-text strong { color: var(--text) }
    .milestones { margin-bottom: 1rem }
    .milestone { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0; border-top: 1px solid var(--border); font-size: 0.85rem }
    .milestone:first-child { border-top: none }
    .milestone .status { font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 999px; font-weight: 500 }
    .status-pending { background: #1e293b; color: var(--pending) }
    .status-approved { background: #1e293b; color: var(--accent) }
    .status-released { background: #1e293b; color: var(--success) }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap }
    .actions button { flex: 1; min-width: 100px; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-family: inherit }
    .actions button:hover:not(:disabled) { border-color: var(--accent); background: rgba(99,102,241,0.1) }
    .actions button:disabled { opacity: 0.35; cursor: not-allowed }
    .actions button.primary { background: var(--accent); border-color: var(--accent); color: white }
    .actions button.primary:hover:not(:disabled) { background: var(--accent-hover) }
    .actions button.success { background: var(--success); border-color: var(--success); color: white }
    .actions button.success:hover:not(:disabled) { background: #16a34a }
    .tx-result { margin-top: 0.5rem; font-size: 0.75rem; word-break: break-all }
    .tx-result a { color: var(--accent); text-decoration: none }
    .tx-result a:hover { text-decoration: underline }
    .tx-result .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 4px; vertical-align: middle }
    @keyframes spin { to { transform: rotate(360deg) } }
    .status-bar { text-align: center; margin-top: 2rem; padding: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; color: var(--muted) }
    .status-bar strong { color: var(--text) }
    .reset-btn { display: block; margin: 1.5rem auto 0; padding: 0.5rem 1.5rem; border: 1px solid #ef4444; border-radius: 8px; background: transparent; color: #ef4444; cursor: pointer; font-family: inherit; font-size: 0.85rem }
    .reset-btn:hover { background: rgba(239,68,68,0.1) }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>CineX Demo</h1>
      <p>Real on-chain campaign funding on Stacks testnet</p>
      <div class="badge">Network: <span>Stacks Testnet</span></div>
    </header>
    <div id="loading" style="text-align:center;padding:4rem;color:var(--muted)">Loading campaigns…</div>
    <div id="error" style="display:none;text-align:center;padding:2rem;color:#ef4444"></div>
    <div class="grid" id="campaign-grid"></div>
    <div class="status-bar" id="status-bar">
      Connected to <strong>testnet</strong>. All transactions are real on-chain calls.
    </div>
    <button class="reset-btn" onclick="location.reload()">↻ Refresh All</button>
  </div>
  <script>
    const API_BASE = 'https://cinex-backend-zo1r.onrender.com';
    const POLL_INTERVAL = 3000;
    const MAX_POLLS = 40;

    async function apiFetch(path, opts = {}) {
      const url = path.startsWith('http') ? path : `${API_BASE}${path}`;
      const resp = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ error: resp.statusText }));
        throw new Error(err.error || `HTTP ${resp.status}`);
      }
      return resp.json();
    }

    function calcStatus(campaign) {
      const allReleased = campaign.milestones.every(m => m.released);
      const anyApproved = campaign.milestones.some(m => m.approved);
      if (allReleased) return 'completed';
      if (campaign.raised >= campaign.goal) return 'milestones';
      return 'funding';
    }

    function milestoneClass(ms) {
      if (ms.released) return 'status-released';
      if (ms.approved) return 'status-approved';
      return 'status-pending';
    }

    function milestoneLabel(ms) {
      if (ms.released) return 'Released';
      if (ms.approved) return 'Approved';
      return 'Pending';
    }

    function pollTx(txHash, onUpdate, onDone) {
      let polls = 0;
      const interval = setInterval(async () => {
        polls++;
        try {
          const data = await apiFetch(`/api/demo/status/${txHash}`);
          onUpdate(data);
          if (data.status === 'confirmed' || data.status === 'failed') {
            clearInterval(interval);
            onDone(data);
          }
        } catch (e) {
          // keep polling
        }
        if (polls >= MAX_POLLS) {
          clearInterval(interval);
          onDone({ status: 'timeout', tx_hash: txHash });
        }
      }, POLL_INTERVAL);
    }

    function showTxResult(container, data) {
      if (data.status === 'broadcast') {
        container.innerHTML = `<span class="spin"></span> Broadcasting… <a href="${data.explorer_url}" target="_blank">${data.tx_hash.slice(0, 18)}…</a>`;
      } else if (data.status === 'pending') {
        container.innerHTML = `<span class="spin"></span> Pending… <a href="${data.explorer_url || '#'}" target="_blank">${data.tx_hash.slice(0, 18)}…</a>`;
      } else if (data.status === 'confirmed') {
        container.innerHTML = `✅ Confirmed <a href="${data.explorer_url}" target="_blank">block ${data.block_height}</a>`;
      } else if (data.status === 'failed') {
        container.innerHTML = `❌ Failed: ${data.error || 'unknown'}`;
      } else if (data.status === 'timeout') {
        container.innerHTML = `⏳ Still pending — <a href="https://explorer.hiro.so/txid/${data.tx_hash}?chain=testnet" target="_blank">check explorer</a>`;
      }
    }

    async function doAction(campaignId, milestoneIndex, action, button) {
      button.disabled = true;
      button.textContent = '…';
      const resultDiv = button.parentElement.nextElementSibling;
      if (!resultDiv || !resultDiv.classList.contains('tx-result')) return;
      resultDiv.innerHTML = `<span class="spin"></span> Sending…`;

      try {
        const body = milestoneIndex !== undefined ? { campaignId, milestoneIndex } : { campaignId, amountUstx: 50000000 };
        const data = await apiFetch(`/api/demo/${action}`, {
          method: 'POST',
          body: JSON.stringify(body),
        });
        showTxResult(resultDiv, data);
        pollTx(data.tx_hash,
          (update) => showTxResult(resultDiv, update),
          () => { loadCampaigns(); }
        );
      } catch (e) {
        resultDiv.innerHTML = `❌ ${e.message}`;
        button.disabled = false;
        button.textContent = action === 'contribute' ? 'Fund 50 STX' : action.charAt(0).toUpperCase() + action.slice(1).replace('-', ' ');
      }
    }

    function renderCampaign(camp) {
      const status = calcStatus(camp);
      const pct = Math.min(100, (camp.raised / camp.goal * 100));
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2>${camp.title}</h2>
        <div class="creator">by ${camp.creator}</div>
        <div class="desc">${camp.description}</div>
        <div class="goal-bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="goal-text"><strong>${(camp.raised / 1e6).toFixed(0)} STX</strong> raised of ${(camp.goal / 1e6).toFixed(0)} STX</div>
        <div class="milestones" id="ms-${camp.id}"></div>
        <div class="actions" id="actions-${camp.id}"></div>
      `;
      return card;
    }

    function renderMilestones(camp) {
      const container = document.getElementById(`ms-${camp.id}`);
      if (!container) return;
      container.innerHTML = camp.milestones.map(ms => `
        <div class="milestone">
          <span>${ms.name} <span style="color:var(--muted)">(${(ms.amount / 1e6).toFixed(0)} STX)</span></span>
          <span class="status ${milestoneClass(ms)}">${milestoneLabel(ms)}</span>
        </div>
      `).join('');
    }

    function renderActions(camp) {
      const container = document.getElementById(`actions-${camp.id}`);
      if (!container) return;
      const status = calcStatus(camp);
      let html = '';

      if (status === 'funding') {
        html += `<button class="primary" onclick="doAction(${camp.id}, null, 'contribute', this)">Fund 50 STX</button>`;
      }

      camp.milestones.forEach((ms, i) => {
        const prevApproved = i === 0 || camp.milestones[i-1].released;
        if (!ms.released) {
          if (status === 'milestones' && !ms.approved && prevApproved) {
            html += `<button onclick="doAction(${camp.id}, ${ms.index}, 'submit-proof', this)" style="font-size:0.75rem">Submit Proof</button>`;
            html += `<button onclick="doAction(${camp.id}, ${ms.index}, 'approve', this)" style="font-size:0.75rem;color:var(--accent)">Approve</button>`;
          }
          if (ms.approved) {
            html += `<button class="success" onclick="doAction(${camp.id}, ${ms.index}, 'release', this)" style="font-size:0.75rem">Release</button>`;
          }
        }
      });

      if (html === '') {
        html = '<span style="font-size:0.8rem;color:var(--muted)">All milestones completed</span>';
      }

      container.innerHTML = html;

      // Add tx result divs after each button group
      camp.milestones.forEach((ms, i) => {
        const existing = container.parentElement.querySelector(`.tx-result[data-ms="${ms.index}"]`);
        if (!existing) {
          const div = document.createElement('div');
          div.className = 'tx-result';
          div.dataset.ms = ms.index;
          container.parentElement.insertBefore(div, container.nextSibling);
        }
      });
    }

    async function loadCampaigns() {
      try {
        const data = await apiFetch('/api/demo/campaigns');
        const grid = document.getElementById('campaign-grid');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'none';
        grid.innerHTML = '';
        data.campaigns.forEach(camp => {
          const card = renderCampaign(camp);
          grid.appendChild(card);
          renderMilestones(camp);
          renderActions(camp);
        });
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        const err = document.getElementById('error');
        err.style.display = 'block';
        err.textContent = `Failed to load campaigns: ${e.message}. Is the backend running?`;
      }
    }

    loadCampaigns();
  </script>
</body>
</html>
